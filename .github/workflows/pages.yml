name: Publish Ninefold
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['reviews/berk-case-review.json']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - name: Audit source documents and review ledger
        run: npm run --silent audit:documents > document-review-dist.json
      - run: npm run build
      - name: Berk rendered reader smoke
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
          python -m http.server 8765 --bind 127.0.0.1 --directory out &
          node tests/berk-reader-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: berk-reader-evidence
          path: |
            berk-browser-evidence.json
            berk-reader.png
      - name: Audit packaged documents and review ledger
        run: node scripts/check_document_reviews.mjs out > document-review-out.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: document-review-reports
          path: document-review-*.json
      - run: python scripts/check_term_reader.py out
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
