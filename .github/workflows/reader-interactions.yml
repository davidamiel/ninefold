name: Check reader interactions
on:
  pull_request:
    paths:
      - 'dist/**'
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'recordings/**'
      - 'package*.json'
      - 'playwright.config.mjs'
      - '.github/workflows/reader-interactions.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reader source verification dependencies
        run: |
          python -m pip install --require-hashes --only-binary :all: -r recordings/test-requirements.txt
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts/check_account_sync.mjs && node scripts/check_recorded_audio.mjs
      - run: python -m unittest discover -s recordings -p 'test_*.py'
      - name: Verify every reviewed OT25 source
        run: python recordings/check_coverage.py --require-reviewed
      - run: npx --no-install playwright install --with-deps chromium webkit
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reader-browser-failures
          path: test-results/
