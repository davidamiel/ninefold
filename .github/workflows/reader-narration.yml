name: Reader narration
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/narration-mapping.test.mjs tests/reader-narration.test.mjs tests/narration-worker.test.mjs tests/narration-voice.test.mjs tests/transcript-timing.test.mjs tests/transcript-render-mapping.test.mjs
