name: Check Ninefold
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check app and audio kit
        run: |
          npm test
          node tests/reader-editor-ui.mjs
          python3 -m unittest discover -s tools/mac-audio -p 'test_*.py'
