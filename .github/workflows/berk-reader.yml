name: Berk deployed reader check
on:
  push:
    branches: [main]
    paths: ['reviews/berk-case-review.json', 'tests/berk-reader-browser.mjs']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - name: Check deployed Berk reader and citation target structure
        env:
          BERK_BASE_URL: https://davidamiel.github.io/ninefold/
        run: node tests/berk-reader-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: berk-live-reader-evidence
          path: |
            berk-browser-evidence.json
            berk-reader.png
