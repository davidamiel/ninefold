name: Verify published Berk reader
on:
  push:
    branches: [main]
    paths: ['.github/workflows/berk-production-verification.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify exact published product
        run: GITHUB_SHA=8f4e8c5dbb4ed43f45f3ca5fbd25858aeb9703ef node scripts/verify_pages_deployment.mjs
      - name: Diagnose deployed Russello asset
        run: node scripts/check_deployed_russello.mjs
      - run: npm install --no-save --package-lock=false playwright
      - name: Check deployed Berk reader and references
        env:
          BERK_CHROME_CHANNEL: chrome
          BERK_BASE_URL: https://davidamiel.github.io/ninefold/
        run: node tests/berk-reader-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: berk-production-verification
          path: |
            pages-live-verification.json
            russello-live-response.json
            berk-browser-evidence.json
            berk-reader.png
